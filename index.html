*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 12% 0%,rgba(200,30,60,.10),transparent 42%),radial-gradient(circle at 95% 55%,rgba(120,20,40,.08),transparent 50%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding-bottom:84px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.banner{height:140px;overflow:hidden;background:linear-gradient(120deg,var(--ac2),var(--ac))}
.head{text-align:center;margin-top:-48px;padding:0 16px}
.av{width:96px;height:96px;border-radius:50%;border:4px solid var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:38px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
h1{margin:6px 0 2px;font-size:22px}h2{font-size:17px;margin:0 0 8px}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:999px;padding:9px 18px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.btn.sm{padding:5px 12px;font-size:13px}.btn.red{background:#c0392b}
.hl{display:flex;gap:14px;justify-content:center;margin:14px 0}
.hl div{text-align:center;font-size:11px;color:var(--mut)}
.hl span{display:flex;width:54px;height:54px;border-radius:50%;border:2px solid var(--ac);align-items:center;justify-content:center;font-size:22px;margin-bottom:3px}

.links a{display:inline-block;margin:4px 8px 0 0;padding:4px 12px;border-radius:999px;background:var(--bd);color:var(--tx);text-decoration:none;font-size:13px}
.subs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd);margin-top:8px}
.subs button{flex:1;background:none;border:0;padding:10px 2px;cursor:pointer;color:var(--mut);font-size:12px;border-bottom:2.5px solid transparent}
.subs button b{display:block;font-size:19px}.subs button.on{color:var(--ac);border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 12px;margin:4px 0}
.pad{padding:0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.ch{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--bd);cursor:pointer}
.th{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff}
.th.bl{filter:blur(14px)}
.bdg{position:absolute;top:8px;left:8px;background:#000a;color:#fff;border-radius:6px;padding:1px 7px;font-size:11px}
.bdg.r{background:#c0392b;left:auto;right:8px}
.cb{padding:8px 10px}.cb b{display:block}.cb i{display:block;color:var(--mut);font-size:12px;font-style:normal;margin:2px 0}
.tg{color:var(--ac2);font-size:11px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row .n{width:26px;font-weight:700;color:var(--ac)}.row .g{flex:1}
.quote{border:1.5px solid var(--bd);border-radius:12px;padding:12px;text-align:center;font-style:italic;margin:12px 16px;background:var(--card)}
.nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:10}
.nav button{flex:1;background:none;border:0;padding:9px 0 7px;color:var(--mut);cursor:pointer;font-size:11px}
.nav button b{display:block;font-size:21px}.nav button.on{color:var(--ac)}
.mo{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.mo .card{margin:0;max-width:340px;text-align:center}
.pix{display:grid;grid-template-columns:repeat(10,22px);gap:0;justify-content:center;margin:12px 0}
.pix i{width:22px;height:22px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:3px 0 8px}.bar div{height:100%;background:var(--ac)}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.hd{display:flex;align-items:flex-end;gap:12px;padding:0 16px;margin-top:-40px}.hd .av{flex:none;width:84px;height:84px;overflow:hidden}.hd h1{margin:0 0 4px;font-size:21px}
.av img,.banner img{width:100%;height:100%;object-fit:cover;display:block}.hl span{overflow:hidden}.hl div{cursor:pointer}.hl .ring{border-color:var(--ac2);border-style:dashed}

.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:22px;z-index:11;cursor:pointer}

.tr{position:absolute;width:6px;height:10px;border-radius:50%;background:#7fd1ff;top:38%;animation:tdrop 1s linear infinite}.tr.t1{left:30%}.tr.t2{left:62%;animation-delay:.5s}\

var rxOwn={},rxBusy=0;
function myRx(){
 var o={};
 (D.stories||[]).forEach(function(st){
  var re=st.re||{};
  Object.keys(re).forEach(function(em){if((re[em]||[]).indexOf(D.me)>=0)o[st.id+'|'+em]=1});
  if((st.vw||[]).indexOf(D.me)>=0)o[st.id+'|_v']=1;
 });

function rxSnap(){return canon((D.stories||[]).map(function(s){return [s.id,s.re||{},s.vw||[]]}))}
function pushRx(){
 if(!uid||!D.me||rxBusy||!ls('cc_rt'))return;
 var mine=myRx(),add=[],del=[];
 Object.keys(mine).forEach(function(k){if(!rxOwn[k])add.push(k)});
 Object.keys(rxOwn).forEach(function(k){if(!mine[k])del.push(k)});
 if(!add.length&&!del.length)return;
 rxBusy++;
 ensureTok().then(function(){
  return Promise.all(add.map(function(k){var a=k.split('|');
   return api('/rest/v1/story_rx',{method:'POST',auth:true,h:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:{story:a[0],uid:uid,em:a[1]}}).then(function(){rxOwn[k]=1})
  }).concat(del.map(function(k){var a=k.split('|');
   return api('/rest/v1/story_rx?story=eq.'+encodeURIComponent(a[0])+'&uid=eq.'+uid+'&em=eq.'+encodeURIComponent(a[1]),{method:'DELETE',auth:true,h:{Prefer:'return=minimal'}}).then(function(){delete rxOwn[k]})
  })));
 }).catch(function(){}).then(function(){rxBusy--});
}

  var by={},own={};

   var who=(uid&&r.uid==uid&&D.me)?D.me:'u:'+r.uid;
   if(uid&&r.uid==uid)own[r.story+'|'+r.em]=1;
   var b=by[r.story]=by[r.story]||{re:{},vw:[]};
   if(r.em=='_v')b.vw.push(who);else(b.re[r.em]=b.re[r.em]||[]).push(who);
  });
  rxOwn=own;
  var mine=myRx(),same=Object.keys(mine).length==Object.keys(own).length&&Object.keys(mine).every(function(k){return own[k]});
  if(!same){pushRx();return}      /* còn thay đổi của máy này chưa gửi: đợi lượt sau */

 });

<script>
/* ===== Thời gian ở trong web (dùng cho BXH "Nuôi thú cưng lâu nhất") =====
   Chỉ tính khi: đã đăng nhập + có thú cưng + tab đang mở & hiển thị + có thao tác trong 5 phút gần nhất.
   Tắt màn hình / chuyển tab / để máy đứng yên quá 5 phút thì KHÔNG tính. */
(function(){
 var IDLE=5*60000,TICK=5000,last=Date.now(),lastAct=Date.now(),pend=0;
 function CE(){return typeof CEMAIL!='undefined'?CEMAIL:''}
 ['pointerdown','pointermove','touchstart','touchmove','keydown','scroll','wheel','click'].forEach(function(n){window.addEventListener(n,function(){lastAct=Date.now()},{capture:true,passive:true})});
 function active(){return !document.hidden&&Date.now()-lastAct<IDLE&&!!D.me&&!!D.pets&&!!D.pets[D.me]}
 function sync(){if(D.me&&D.me===CE()){D.cpets={name:(D.users[D.me]&&D.users[D.me].name)||(D.prof&&D.prof.name)||'Creator',pets:D.pets[D.me]||{}}}}
 function flush(){if(!pend)return;pend=0;sync();try{save()}catch(x){}}
 function tick(){
  var now=Date.now(),dt=Math.min(now-last,TICK*2);last=now;
  if(!active())return;
  var P=D.pets[D.me];Object.keys(P).forEach(function(k){var p=P[k];if(p&&typeof p=='object')p.act=(+p.act||0)+dt});
  pend+=dt;
  if(pend>=(D.me===CE()?300000:120000))flush();       /* gửi lên cloud mỗi 2 phút (creator: 5 phút) */
 }
 setInterval(tick,TICK);
 document.addEventListener('visibilitychange',function(){last=Date.now();if(document.hidden)flush()});
 window.addEventListener('pagehide',flush);
})();
</script>
